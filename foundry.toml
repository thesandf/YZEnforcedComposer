[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
cache_path = 'cache'
build_info_path = 'build-info'

# Solidity compiler settings
solc = '0.8.26'
optimizer = true
optimizer_runs = 200
via_ir = false

# EVM settings
evm_version = 'cancun'

# Test settings
test = 'test'
script = 'script'
broadcast = 'broadcast'

# Remappings - from lz-address-book remappings.txt plus needed ones
remappings = [
    '@layerzerolabs/lz-evm-protocol-v2=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/protocol/',
    '@layerzerolabs/lz-evm-messagelib-v2=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/messagelib/',
    '@layerzerolabs/oft-evm=lib/lz-address-book/lib/devtools/packages/oft-evm/',
    '@layerzerolabs/oapp-evm=lib/lz-address-book/lib/devtools/packages/oapp-evm/',
    '@openzeppelin/contracts=lib/openzeppelin-contracts/contracts/',
    'solidity-bytes-utils=lib/lz-address-book/lib/solidity-bytes-utils/',
    'forge-std=lib/forge-std/src/',
    'lz-address-book=lib/lz-address-book/src/',
    '@layerzerolabs/ovault-evm=lib/lz-address-book/lib/devtools/packages/ovault-evm/',
    '@layerzerolabs/test-devtools-evm-foundry=lib/lz-address-book/lib/devtools/packages/test-devtools-evm-foundry/',
]

# RPC endpoints for testing
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
base = "${BASE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
